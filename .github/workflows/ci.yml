name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the API boots its own PostgreSQL cluster (embedded-postgres), so the
      # integration suite runs against a real database with no service container
      - name: Typecheck (client + server)
        run: npm run typecheck

      - name: Commerce core integration tests
        run: npm test

      - name: Build storefront
        run: npm run build
